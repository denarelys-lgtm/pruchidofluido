plugins {
    id 'com.android.library'
}

android {
    namespace 'com.example.screendaemon'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            java {
                srcDirs = ['../app/src/main/java']
                include '**/ScreenDaemon.java'
            }
        }
    }
}

dependencies {
    // Librerías requeridas para resolver los imports al compilar
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'dev.rikka.shizuku:api:13.1.0'
    implementation 'dev.rikka.shizuku:provider:13.1.0'
}

task buildDaemonJar {
    dependsOn 'compileDebugJavaWithJavac'
    
    doLast {
        def assetsDir = file("${project.rootDir}/app/src/main/assets")
        if (!assetsDir.exists()) {
            assetsDir.mkdirs()
        }

        def sdkDir = android.sdkDirectory.path
        def d8Executable = "${sdkDir}/build-tools/34.0.0/d8"
        
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            d8Executable += ".bat"
        }

        // Busca el archivo compilado ScreenDaemon.class
        def classFiles = fileTree(dir: "${buildDir}/intermediates/javac/debug", include: '**/ScreenDaemon.class').files
        if (classFiles.isEmpty()) {
            throw new GradleException("No se encontró el archivo ScreenDaemon.class compilado.")
        }
        
        def classFile = classFiles.first()
        def outputJar = file("${assetsDir}/ScreenDaemon.jar")

        exec {
            commandLine d8Executable, '--output', outputJar.absolutePath, classFile.absolutePath
        }
        println "ScreenDaemon.jar generado con éxito en: ${outputJar.absolutePath}"
    }
}

project(':app').tasks.preBuild.dependsOn buildDaemonJar
