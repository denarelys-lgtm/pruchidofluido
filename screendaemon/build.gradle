plugins {
    id 'com.android.library'
}

android {
    namespace 'com.example.screendaemon'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Le indicamos al módulo que tome el archivo ScreenDaemon.java ubicado en :app
    sourceSets {
        main {
            java {
                srcDirs = ['../app/src/main/java']
                include '**/ScreenDaemon.java'
            }
        }
    }
}

task buildDaemonJar {
    dependsOn 'compileDebugJavaWithJavac'
    
    doLast {
        def assetsDir = file("${project.rootDir}/app/src/main/assets")
        if (!assetsDir.exists()) {
            assetsDir.mkdirs()
        }

        def sdkDir = android.sdkDirectory.path
        def d8Executable = "${sdkDir}/build-tools/34.0.0/d8"
        
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            d8Executable += ".bat"
        }

        // Búsqueda dinámica de la clase compilada independientemente de la variante interna
        def classFile = fileTree(dir: "${buildDir}/intermediates/javac", include: '**/ScreenDaemon.class').singleFile
        def outputJar = file("${assetsDir}/ScreenDaemon.jar")

        if (classFile.exists()) {
            exec {
                commandLine d8Executable, '--output', outputJar.absolutePath, classFile.absolutePath
            }
            println "ScreenDaemon.jar generado con éxito en: ${outputJar.absolutePath}"
        } else {
            throw new GradleException("No se encontró el archivo ScreenDaemon.class compilado.")
        }
    }
}

project(':app').tasks.preBuild.dependsOn buildDaemonJar
