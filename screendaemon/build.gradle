plugins {
    id 'com.android.library'
}

android {
    namespace 'com.example.screendaemon'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Compila ÚNICAMENTE ScreenDaemon.java de forma aislada sin procesar la UI ni recursos R de :app
task compileDaemonClass(type: JavaCompile) {
    source = fileTree(dir: '../app/src/main/java', include: '**/ScreenDaemon.java')
    destinationDirectory = file("${buildDir}/intermediates/daemon_classes")
    classpath = files(android.getBootClasspath())
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

// Transforma la clase compilada en DEX/JAR dentro de app/src/main/assets
task buildDaemonJar {
    dependsOn compileDaemonClass

    doLast {
        def assetsDir = file("${project.rootDir}/app/src/main/assets")
        if (!assetsDir.exists()) {
            assetsDir.mkdirs()
        }

        def sdkDir = android.sdkDirectory.path
        def d8Executable = "${sdkDir}/build-tools/34.0.0/d8"

        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            d8Executable += ".bat"
        }

        def classFiles = fileTree(dir: "${buildDir}/intermediates/daemon_classes", include: '**/ScreenDaemon.class').files
        if (classFiles.isEmpty()) {
            throw new GradleException("No se encontró el archivo ScreenDaemon.class compilado en ${buildDir}/intermediates/daemon_classes")
        }

        def classFile = classFiles.first()
        def outputJar = file("${assetsDir}/ScreenDaemon.jar")

        exec {
            commandLine d8Executable, '--output', outputJar.absolutePath, classFile.absolutePath
        }
        println "ScreenDaemon.jar generado con éxito en: ${outputJar.absolutePath}"
    }
}

project(':app').tasks.preBuild.dependsOn buildDaemonJar
