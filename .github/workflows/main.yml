name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components & Accept Licenses
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Install Gradle 8.7 via SDKMAN
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.7
          echo "$HOME/.sdkman/candidates/gradle/current/bin" >> $GITHUB_PATH

      - name: Build ScreenDaemon.jar
        run: |
          mkdir -p build_daemon/classes app/src/main/assets
          javac -cp "$ANDROID_HOME/platforms/android-34/android.jar" \
            -d build_daemon/classes \
            app/src/main/java/com/example/detectcamera/ScreenDaemon.java
          
          $ANDROID_HOME/build-tools/34.0.0/d8 \
            --output build_daemon/classes.jar \
            build_daemon/classes/com/example/detectcamera/ScreenDaemon.class
          
          cp build_daemon/classes.jar app/src/main/assets/ScreenDaemon.jar

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: detect-camera-app
          path: app/build/outputs/apk/debug/app-debug.apk
          
