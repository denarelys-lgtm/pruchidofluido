name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components & Accept Licenses
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Install Gradle 8.7 via SDKMAN
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.7
          echo "$HOME/.sdkman/candidates/gradle/current/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      # Copia ambos archivos a una carpeta única para que queden juntos en el Zip
      - name: Bundle APK and ScreenDaemon.jar
        run: |
          mkdir -p output_bundle
          cp app/build/outputs/apk/debug/app-debug.apk output_bundle/
          cp app/src/main/assets/ScreenDaemon.jar output_bundle/

      - name: Upload Complete Package
        uses: actions/upload-artifact@v4
        with:
          name: detect-camera-package
          path: output_bundle/
